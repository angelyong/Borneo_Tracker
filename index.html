<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borneo Tracker — ESG, SDG &amp; Resilience Index for Borneo</title>
    <meta
      name="description"
      content="Environmental, social and sustainability indicators for Sabah, Sarawak, Brunei and Kalimantan in one place, scored into a 0–100 Resilience Index with visible sources and confidence."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Borneo Tracker" />
    <meta property="og:title" content="Borneo Tracker — ESG, SDG &amp; Resilience Index for Borneo" />
    <meta
      property="og:description"
      content="Environmental, social and sustainability indicators for Sabah, Sarawak, Brunei and Kalimantan in one place, scored into a 0–100 Resilience Index with visible sources and confidence."
    />
    <meta name="twitter:card" content="summary" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #f5f7f8;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
    </style>
    <script>
      // Set the theme before first paint so switching themes never flashes
      // the wrong one on load. Mirrors the logic in src/utils/theme.js.
      (function () {
        try {
          var stored = localStorage.getItem('borneo-tracker:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
