name: Catch up missed Manifest anchors

on:
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: phase1-publication
  queue: max
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dispatch each missing exact historical version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python catch_up_anchors.py --dispatch
