name: Deploy to DirectAdmin

# ═══════════════════════════════════════════════════════════════════════════════
# Closes the production loop:  validate -> build -> assert -> upload -> VERIFY.
#
# WHY THIS EXISTS
#   `refresh-data.yml` regenerates public/data/*.json every morning and commits
#   them to the repo — but nothing ever pushed them to the web server, so
#   production stayed frozen at the 2026-07-23 hand-uploaded ZIP while the
#   Actions dashboard went green every single day. That is an *open loop that
#   lies*. This workflow closes it, and — just as important — it VERIFIES the
#   result against the live URL, because a deploy you did not verify is still an
#   open loop.
#
#   Implements "Option A" of docs/DIRECTADMIN_DASHBOARD_DATA_UPDATE_OPTIONS.md.
#   Owner setup checklist: docs/DEPLOYMENT_SETUP.md.
#
# ─── SECRETS THE REPO OWNER MUST CREATE ───────────────────────────────────────
#   Settings -> Secrets and variables -> Actions -> "Secrets" tab -> New secret
#
#   SFTP_HOST          Hostname of the DirectAdmin server (e.g. sg-shared01.dapanel.net).
#                      Host name only — no scheme, no path, no port.
#   SFTP_PORT          Connection port. 22 for SFTP, 21 for FTPS. (Optional —
#                      defaults to 22 for sftp / 21 for ftps.)
#   SFTP_USER          Deployment username.
#   SFTP_KEY           *** PRIMARY authentication method. *** The full OpenSSH
#                      PRIVATE key (BEGIN ... END lines included) of a key whose
#                      public half is in the deploy account's authorized_keys.
#                      Preferred because it is revocable on its own, cannot be
#                      reused to log into DirectAdmin's web panel, and never
#                      needs to be typed anywhere.
#   SFTP_PASSWORD      FALLBACK, only if the host will not accept a key. Used
#                      instead of SFTP_KEY when SFTP_KEY is absent.
#   SFTP_REMOTE_DIR    Absolute remote path to deploy into. (Optional — defaults
#                      to /domains/borneotracker.rentsmartprop.com.my/public_html.
#                      If the deploy account is chrooted to its own home this
#                      will instead be something like /public_html.)
#   SFTP_KNOWN_HOSTS   (Optional but RECOMMENDED, SFTP only.) The server's SSH
#                      host key line(s), i.e. the output of
#                      `ssh-keyscan -p <port> <host>`. Pinning this makes the
#                      connection resistant to a man-in-the-middle. Without it
#                      the workflow falls back to trust-on-first-use and prints
#                      the fingerprint it accepted so you can check it.
#   VITE_SUPABASE_URL       Production Supabase project URL. REQUIRED: the build
#   VITE_SUPABASE_ANON_KEY  is env-gated (src/services/supabaseClient.js). Ship
#                           without these and production silently regresses to
#                           the local mock auth/news store.
#
# ─── VARIABLES THE OWNER MAY SET ──────────────────────────────────────────────
#   Same screen, "Variables" tab. All optional; sane defaults below.
#
#   PRODUCTION_URL            Public base URL to smoke-test.
#                             Default: https://borneotracker.rentsmartprop.com.my
#   SMOKE_ALLOW_INSECURE_TLS  "false" (default) = smoke test validates the
#                             public HTTPS certificate. Set to "true" only as a
#                             temporary, explicitly approved diagnostic override;
#                             every such run emits a security warning.
#   DEPLOY_PROTOCOL           "sftp" (default) or "ftps".
#   FTPS_VERIFY_CERT          "yes" (default) / "no" — FTPS control-channel
#                             certificate verification. Only read for ftps. "no"
#                             is an emergency diagnostic override, never routine.
#
# ─── MANUAL WORKFLOW MODES ───────────────────────────────────────────────────
#   dry_run                  Build + validate + assert only. No server contact.
#   connection_test_only     Connect, authenticate, `cd` and list the configured
#                            directory only. No upload or smoke test. This is the
#                            safe first live test of an Explicit-FTPS account.
#
# ─── THINGS THIS WORKFLOW DELIBERATELY DOES NOT DO ────────────────────────────
#   * It never DELETES remote files (see the mirror step). First iteration is
#     strictly additive/overwriting, per §2.4 of the DirectAdmin options doc.
#   * It never echoes a secret. Only secret NAMES appear in the log.
#   * It uses only first-party `actions/*` actions, pinned by major version.
#     No third-party marketplace SFTP action is used: those run with the deploy
#     credentials in scope, and an unpinned one is an unreviewed supply-chain
#     hole aimed straight at production.
# ═══════════════════════════════════════════════════════════════════════════════

on:
  # A proof publisher can request an automatic production release only with an
  # exact proof commit.  Manual runs remain available for dry-runs, connection
  # tests, approved production releases, and rollback.
  repository_dispatch:
    types: [deploy-proof]
  workflow_dispatch:
    inputs:
      release_mode:
        description: "dry_run validates/builds; connection_test_only reads the host; production uploads."
        required: true
        type: choice
        options:
          - dry_run
          - connection_test_only
          - production
        default: dry_run
      proof_commit_sha:
        description: "Exact 40-character lowercase SHA of the proof-bearing commit on master."
        required: true
        type: string
      confirm_production:
        description: "Set true only after the exact proof commit has passed release preflight. Required for production upload."
        required: true
        type: boolean
        default: false

# A deploy must never be cancelled halfway. `cancel-in-progress: true` — correct
# for CI, where the newest commit is the only one that matters — would be free to
# kill lftp mid-mirror and leave public_html holding half the new asset hashes
# with an index.html pointing at files that are not there yet. So we QUEUE
# instead: one deploy at a time, each allowed to finish. A superseded deploy
# costs a few wasted minutes; a shredded public_html costs a manual ZIP upload.
concurrency:
  # Share the publication lock with refresh/anchor/upgrade.  An automatic
  # release therefore cannot race a proof writer after its exact-SHA check.
  group: phase1-publication
  queue: max
  cancel-in-progress: false

# Read-only. This workflow publishes; it never writes back to the repository.
permissions:
  contents: read

jobs:
  deploy:
    name: Build, upload and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      # Production protection remains a second guard. A trusted automatic proof
      # dispatch is a production release; manual preflight modes are not.
      name: ${{ github.event_name == 'repository_dispatch' && 'production' || inputs.release_mode == 'production' && 'production' || 'release-preflight' }}
      url: ${{ vars.PRODUCTION_URL || 'https://borneotracker.rentsmartprop.com.my' }}

    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://borneotracker.rentsmartprop.com.my' }}
      DEFAULT_REMOTE_DIR: /domains/borneotracker.rentsmartprop.com.my/public_html

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # 0. Validate the requested release mode and prerequisites. A missing
      # production prerequisite is a red failure, never a green "skip".
      # ─────────────────────────────────────────────────────────────────────
      - name: Check deployment secrets
        id: gate
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          PROOF_COMMIT_SHA: ${{ inputs.proof_commit_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          DISPATCH_PROOF_COMMIT_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.proof_commit_sha || '' }}
          DISPATCH_SOURCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || '' }}
          DISPATCH_SENDER: ${{ github.event_name == 'repository_dispatch' && github.event.sender.login || '' }}
          AUTO_PRODUCTION_DEPLOY: ${{ vars.AUTO_PRODUCTION_DEPLOY || 'false' }}
          DEPLOY_PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
          SMOKE_ALLOW_INSECURE_TLS: ${{ vars.SMOKE_ALLOW_INSECURE_TLS || 'false' }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            if [ "${AUTO_PRODUCTION_DEPLOY}" != "true" ]; then
              echo "::error title=Automatic production deployment disabled::Set the repository variable AUTO_PRODUCTION_DEPLOY=true only after the hosting cache policy has been verified. Nothing was uploaded."
              exit 1
            fi
            case "${DISPATCH_SOURCE}" in anchor|upgrade) ;; *)
              echo "::error title=Bad deployment dispatch::source must be anchor or upgrade."
              exit 1
            esac
            RELEASE_MODE="production"
            PROOF_COMMIT_SHA="${DISPATCH_PROOF_COMMIT_SHA}"
            CONFIRM_PRODUCTION="true"
          elif [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "::error title=Unsupported deployment event::${EVENT_NAME}"
            exit 1
          fi

          case "${RELEASE_MODE}" in dry_run|connection_test_only|production) ;; *)
            echo "::error title=Bad workflow input::release_mode must be dry_run, connection_test_only, or production."
            exit 1
          esac
          if ! [[ "${PROOF_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Bad workflow input::proof_commit_sha must be a full 40-character lowercase Git commit SHA."
            exit 1
          fi
          case "${CONFIRM_PRODUCTION}" in true|false) ;; *)
            echo "::error title=Bad workflow input::confirm_production must be true or false."
            exit 1
          esac
          if [ "${RELEASE_MODE}" = "production" ] && [ "${CONFIRM_PRODUCTION}" != "true" ]; then
            echo "::error title=Production confirmation required::Set confirm_production=true only after the exact proof commit has passed preflight."
            exit 1
          fi
          case "${SMOKE_ALLOW_INSECURE_TLS}" in true|false) ;; *)
            echo "::error title=Bad configuration::SMOKE_ALLOW_INSECURE_TLS must be true or false (default: false)."
            exit 1
          esac
          if [ "${SMOKE_ALLOW_INSECURE_TLS}" = "true" ]; then
            echo "::warning title=TLS verification override enabled::SMOKE_ALLOW_INSECURE_TLS=true was explicitly configured. This run's public smoke test will ignore HTTPS certificate errors; restore false immediately after the approved diagnostic."
          fi

          echo "mode=${RELEASE_MODE}" >> "$GITHUB_OUTPUT"
          echo "proof_commit_sha=${PROOF_COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "protocol=${DEPLOY_PROTOCOL}" >> "$GITHUB_OUTPUT"

          missing=""
          # dry_run uses production build inputs but makes no server contact.
          if [ "${RELEASE_MODE}" != "connection_test_only" ]; then
            [ -n "${VITE_SUPABASE_URL:-}" ]      || missing="${missing} VITE_SUPABASE_URL"
            [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || missing="${missing} VITE_SUPABASE_ANON_KEY"
          fi
          # connection_test_only proves transport; production needs transport
          # plus build inputs. Only names are ever printed.
          if [ "${RELEASE_MODE}" != "dry_run" ]; then
            [ -n "${SFTP_HOST:-}" ] || missing="${missing} SFTP_HOST"
            [ -n "${SFTP_USER:-}" ] || missing="${missing} SFTP_USER"
            if [ -z "${SFTP_KEY:-}" ] && [ -z "${SFTP_PASSWORD:-}" ]; then
              missing="${missing} SFTP_KEY_or_SFTP_PASSWORD"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Deployment prerequisites missing::Missing required secrets for ${RELEASE_MODE}:${missing}. Nothing was uploaded."
            exit 1
          fi

          if [ "${RELEASE_MODE}" != "dry_run" ]; then
            if [ -n "${SFTP_KEY:-}" ]; then
              echo "auth=key" >> "$GITHUB_OUTPUT"
              echo "Auth method: SSH private key (SFTP_KEY)."
            else
              echo "auth=password" >> "$GITHUB_OUTPUT"
              echo "::warning title=Password authentication in use::SFTP_KEY is not set, falling back to SFTP_PASSWORD. A key is preferred — see docs/DEPLOYMENT_SETUP.md."
            fi
            echo "All required transport prerequisites are present. Protocol: ${DEPLOY_PROTOCOL}."
          fi

      # ─────────────────────────────────────────────────────────────────────
      # 1. Checkout.
      #
      # A proof release uses its explicit proof-artifact SHA, never a branch tip.
      # ─────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.gate.outputs.proof_commit_sha }}
          fetch-depth: 0

      - name: Verify requested proof commit is an immutable master release
        id: release
        env:
          PROOF_COMMIT_SHA: ${{ steps.gate.outputs.proof_commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || '' }}
          DISPATCH_SENDER: ${{ github.event_name == 'repository_dispatch' && github.event.sender.login || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          git cat-file -e "${PROOF_COMMIT_SHA}^{commit}"
          git merge-base --is-ancestor "${PROOF_COMMIT_SHA}" origin/master
          test "$(git rev-parse HEAD)" = "${PROOF_COMMIT_SHA}"
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            test "${PROOF_COMMIT_SHA}" = "$(git rev-parse origin/master)"
            python verify_release_commit.py "${PROOF_COMMIT_SHA}" "${DISPATCH_SOURCE}" "${DISPATCH_SENDER}"
            echo "Automatic release is the current master proof commit."
          fi
          echo "Proof commit is present and is an ancestor of origin/master."

      - name: Record the exact commit being deployed
        id: rev
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          git log -1 --pretty='Deploying %h %s (%ci)'

      # ─────────────────────────────────────────────────────────────────────
      # 2. Data validation gate. Nothing gets past here if the data is bad.
      # ─────────────────────────────────────────────────────────────────────
      - name: Set up Python
        if: steps.gate.outputs.mode != 'connection_test_only'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate dashboard data (blocking gate)
        if: steps.gate.outputs.mode != 'connection_test_only'
        run: |
          set -euo pipefail
          if [ ! -f validate_data.py ]; then
            echo "::error title=Data validation script missing::validate_data.py is not in the repository. Refusing to publish unvalidated data to production."
            exit 1
          fi
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          fi
          echo "Running validate_data.py ..."
          python validate_data.py

      - name: Verify exact proof release contract
        if: steps.gate.outputs.mode != 'connection_test_only'
        run: |
          set -euo pipefail
          python verify_proof_contract.py public/data
          python verify_anchor.py --allow-pending

      # ─────────────────────────────────────────────────────────────────────
      # 3. Build.
      # ─────────────────────────────────────────────────────────────────────
      - name: Set up Node
        if: steps.gate.outputs.mode != 'connection_test_only'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned major. Vite 8 requires ^20.19 || >=22.12; 22 is the active
          # LTS and matches the version the site was last built with locally.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.mode != 'connection_test_only'
        run: npm ci

      - name: Build production bundle
        if: steps.gate.outputs.mode != 'connection_test_only'
        env:
          # Env-gated in src/services/supabaseClient.js. Without these the build
          # silently falls back to the local mock news/auth store.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # 4. Post-build assertions — the last chance to stop before production.
      #
      # The manifest helper is written to RUNNER_TEMP rather than committed so
      # that the deploy contract lives in exactly one reviewable file (this one)
      # and so the smoke test and the pre-upload check cannot drift apart: both
      # normalise the manifest with the same code.
      # ─────────────────────────────────────────────────────────────────────
      - name: Assert the build is publishable
        if: steps.gate.outputs.mode != 'connection_test_only'
        id: assert
        run: |
          set -euo pipefail
          fail=0

          # `-s` = exists AND is non-empty. The non-empty part matters most for
          # .htaccess: shipping a zero-byte one would silently remove the SPA
          # rewrite and 404 every deep link (/news, /reports, /admin, ...).
          publish_files=(
            dist/index.html \
            dist/.htaccess \
            dist/data/.htaccess \
            dist/data/manifest.json \
            dist/data/provenance.jsonl \
            dist/data/anchors.jsonl \
            dist/data/manifest.json.ots
          )
          while read -r manifest_path; do publish_files+=("dist/${manifest_path#public/}"); done < <(python verify_manifest.py paths)
          for f in "${publish_files[@]}"; do
            if [ -s "$f" ]; then
              printf '  ok      %-32s %s bytes\n' "$f" "$(stat -c%s "$f")"
            else
              echo "::error title=Pre-upload assertion failed::$f is missing or empty — refusing to deploy."
              fail=1
            fi
          done

          # dist/.htaccess comes from public/.htaccess (Vite copies public/ as-is).
          # Confirm it still carries the rewrite, not just that a file exists.
          if [ -s dist/.htaccess ] && ! grep -qi 'RewriteEngine' dist/.htaccess; then
            echo "::error title=Pre-upload assertion failed::dist/.htaccess does not contain a RewriteEngine directive — SPA deep links would break."
            fail=1
          fi
          if [ -s dist/data/.htaccess ] && ! grep -qi 'Cache-Control' dist/data/.htaccess; then
            echo "::error title=Pre-upload assertion failed::dist/data/.htaccess does not contain the required data cache policy."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1

          # Full-SHA snapshot/proof pair must be packaged alongside the latest
          # aliases. This is the historical verification contract, not optional
          # display metadata.
          MANIFEST_SHA="$(sha256sum dist/data/manifest.json | awk '{print $1}')"
          test -s "dist/data/versions/${MANIFEST_SHA}/manifest.json"
          test -s "dist/data/versions/${MANIFEST_SHA}/manifest.json.ots"
          cmp -s dist/data/manifest.json "dist/data/versions/${MANIFEST_SHA}/manifest.json"

          echo ""
          echo "Verifying every data file against dist/data/manifest.json:"
          python verify_manifest.py verify dist/data --expected-out "$RUNNER_TEMP/expected.json"

          GENERATED_AT="$(python -c "import json;print(json.load(open('dist/data/indicators.json',encoding='utf-8'))['generatedAt'])")"
          echo "generated_at=${GENERATED_AT}" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────
      # 5. Upload.
      #
      # WHY lftp AND NOT A MARKETPLACE ACTION
      #   Whatever runs this step holds credentials that can overwrite a live
      #   public_html. A third-party action pulled in by a floating tag is an
      #   unreviewed dependency with exactly that power. lftp is a 25-year-old
      #   Debian-packaged client installed from Ubuntu's own repo; the whole
      #   transfer script is right here in the diff and can be read line by line.
      #
      # NON-DESTRUCTIVE BY DESIGN
      #   `mirror -R` with NO `--delete`, per §2.4 of the DirectAdmin doc:
      #   observe several clean runs before anything is allowed to remove files.
      #   CONSEQUENCE / FOLLOW-UP: Vite emits content-hashed asset filenames, so
      #   every build that changes a chunk leaves the previous hashed file behind
      #   forever. They are harmless (nothing links to them) but they accumulate
      #   and eat the hosting quota. Follow-up once this has run cleanly for a
      #   week or two: either a periodic manual cleanup of dist/assets/ via the
      #   DirectAdmin File Manager, or a second phase that adds
      #   `--delete --only-existing` scoped to assets/ alone.
      #
      # ORDERING
      #   Assets and data go up FIRST, then index.html and .htaccess LAST. If the
      #   connection dies mid-run, the live index.html still points at the old
      #   (still present, because we never delete) assets, so the site keeps
      #   working instead of white-screening on a missing chunk.
      # ─────────────────────────────────────────────────────────────────────
      - name: Install lftp
        if: steps.gate.outputs.mode != 'dry_run'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # sshpass is only pulled in for the password fallback; with a key it is
          # unused. `-e` makes it read the password from $SSHPASS, so it never
          # appears in the process table.
          sudo apt-get install -y -qq lftp sshpass
          lftp --version | head -1

      - name: Prepare credentials
        if: steps.gate.outputs.mode != 'dry_run'
        id: creds
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          PROTOCOL: ${{ steps.gate.outputs.protocol }}
          AUTH: ${{ steps.gate.outputs.auth }}
          FTPS_VERIFY_CERT: ${{ vars.FTPS_VERIFY_CERT || 'yes' }}
        run: |
          set -euo pipefail
          umask 077

          if [ "$PROTOCOL" != "sftp" ] && [ "$PROTOCOL" != "ftps" ]; then
            echo "::error title=Bad configuration::DEPLOY_PROTOCOL must be 'sftp' or 'ftps', got '${PROTOCOL}'."
            exit 1
          fi
          if [ "$PROTOCOL" = "ftps" ] && [ "$AUTH" = "key" ]; then
            echo "::error title=Bad configuration::FTPS cannot use an SSH key. Set SFTP_PASSWORD, or switch DEPLOY_PROTOCOL back to sftp."
            exit 1
          fi
          if [ "$PROTOCOL" = "ftps" ] && [ "$(printf '%s' "$SFTP_PASSWORD" | wc -l)" -gt 0 ]; then
            echo "::error title=Unusable password::SFTP_PASSWORD contains a newline. Re-enter the secret without a trailing line break."
            exit 1
          fi

          # Secrets are deliberately validated before lftp is invoked. In
          # particular, `open` accepts URLs, while SFTP_HOST must be only a
          # hostname: accepting a scheme, path, whitespace or a port here could
          # redirect a deployment to an unintended endpoint.
          if [[ -z "${SFTP_HOST:-}" || "$SFTP_HOST" =~ [[:space:]/:@] || "$SFTP_HOST" == *".."* || ! "$SFTP_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
            echo "::error title=Bad configuration::SFTP_HOST must be a hostname only (no scheme, path, port, or whitespace)."
            exit 1
          fi

          PORT="${SFTP_PORT:-}"
          if [ -z "$PORT" ]; then
            if [ "$PROTOCOL" = "ftps" ]; then PORT=21; else PORT=22; fi
            echo "SFTP_PORT not set; defaulting to ${PORT} for ${PROTOCOL}."
          fi
          if ! [[ "$PORT" =~ ^[0-9]+$ ]] || (( 10#$PORT < 1 || 10#$PORT > 65535 )); then
            echo "::error title=Bad configuration::SFTP_PORT must be a number from 1 to 65535."
            exit 1
          fi
          echo "port=${PORT}" >> "$GITHUB_OUTPUT"

          REMOTE_DIR="${SFTP_REMOTE_DIR:-$DEFAULT_REMOTE_DIR}"
          # `/` is valid for an FTP account chrooted directly to public_html.
          # All other accepted paths are absolute POSIX paths made of ordinary
          # path components only; reject quotes/newlines/shell-like characters
          # before interpolating the value into the lftp script.
          if [[ "$REMOTE_DIR" == *$'\n'* || "$REMOTE_DIR" == *$'\r'* || "$REMOTE_DIR" == *\"* || "$REMOTE_DIR" == *\'* || "$REMOTE_DIR" == *\\* || "$REMOTE_DIR" == *"//"* || "$REMOTE_DIR" == *"/."* || ! "$REMOTE_DIR" =~ ^/([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]*$ ]]; then
            echo "::error title=Bad configuration::SFTP_REMOTE_DIR must be a safe absolute POSIX path (for example / or /domains/example/public_html)."
            exit 1
          fi

          if [ "$PROTOCOL" = "ftps" ] && [ "$FTPS_VERIFY_CERT" != "yes" ] && [ "$FTPS_VERIFY_CERT" != "no" ]; then
            echo "::error title=Bad configuration::FTPS_VERIFY_CERT must be yes or no (default: yes)."
            exit 1
          fi
          if [ "$PROTOCOL" = "ftps" ] && [ "$FTPS_VERIFY_CERT" = "no" ]; then
            echo "::warning title=FTPS certificate verification disabled::FTPS_VERIFY_CERT=no is an emergency temporary diagnostic override. Do not use it for routine production deployment; correct the hostname/certificate and restore yes."
          fi

          if [ "$PROTOCOL" = "sftp" ]; then
            KNOWN="$RUNNER_TEMP/known_hosts"
            if [ -n "${SFTP_KNOWN_HOSTS:-}" ]; then
              printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$KNOWN"
              echo "Host key pinned from the SFTP_KNOWN_HOSTS secret."
            else
              # Trust-on-first-use. Better than StrictHostKeyChecking=no because
              # the fingerprint we accepted is printed and can be checked against
              # what the hosting admin says it should be — and then pinned.
              ssh-keyscan -p "$PORT" -H "$SFTP_HOST" > "$KNOWN" 2>/dev/null || true
              if [ ! -s "$KNOWN" ]; then
                echo "::error title=Cannot reach the SFTP host::ssh-keyscan returned nothing for port ${PORT}. Wrong host/port, or the server blocks GitHub Actions runners (see §2.3 item 8-9 of the DirectAdmin doc)."
                exit 1
              fi
              echo "::warning title=SSH host key not pinned::Accepted the host key on first use. Check the fingerprint below with the hosting admin, then store the output of 'ssh-keyscan -p ${PORT} <host>' as the SFTP_KNOWN_HOSTS secret."
              echo "Accepted host key fingerprints:"
              ssh-keygen -lf "$KNOWN" || true
            fi
            chmod 600 "$KNOWN"

            if [ "$AUTH" = "key" ]; then
              KEYFILE="$RUNNER_TEMP/deploy_key"
              # printf (not echo) guarantees the trailing newline OpenSSH insists on.
              printf '%s\n' "$SFTP_KEY" > "$KEYFILE"
              chmod 600 "$KEYFILE"
              if ! ssh-keygen -y -f "$KEYFILE" > /dev/null 2>&1; then
                echo "::error title=Unusable SSH key::SFTP_KEY is not a readable OpenSSH private key (passphrase-protected keys are not supported). Re-paste the full file, BEGIN/END lines included."
                exit 1
              fi
              echo "SSH private key loaded and parsed."
            fi
          fi

      # A connection-only run is the safe first live check for an FTP account.
      # It proves TLS, authentication, chroot/path and read permission without
      # ever writing to the server. Dry runs stay entirely offline by design.
      - name: Test DirectAdmin connection (read only)
        if: steps.gate.outputs.mode == 'connection_test_only'
        id: connection
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          PROTOCOL: ${{ steps.gate.outputs.protocol }}
          AUTH: ${{ steps.gate.outputs.auth }}
          PORT: ${{ steps.creds.outputs.port }}
          FTPS_VERIFY_CERT: ${{ vars.FTPS_VERIFY_CERT || 'yes' }}
        run: |
          set -euo pipefail
          umask 077

          REMOTE_DIR="${SFTP_REMOTE_DIR:-$DEFAULT_REMOTE_DIR}"
          SCRIPT="$RUNNER_TEMP/lftp.connection-test.script"
          : > "$SCRIPT"
          chmod 600 "$SCRIPT"
          # The script contains the password for FTPS. Delete it even if lftp
          # exits non-zero; GitHub destroys the runner too, but do not rely on it.
          trap 'rm -f "$SCRIPT"' EXIT

          {
            echo "set cmd:fail-exit yes"
            echo "set net:max-retries 1"
            echo "set net:timeout 30"
          } >> "$SCRIPT"

          if [ "$PROTOCOL" = "sftp" ]; then
            if [ "$AUTH" = "key" ]; then
              echo "set sftp:connect-program \"ssh -a -x -i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -p $PORT\"" >> "$SCRIPT"
            else
              export SSHPASS="$SFTP_PASSWORD"
              echo "set sftp:connect-program \"sshpass -e ssh -a -x -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -p $PORT\"" >> "$SCRIPT"
            fi
            echo "open sftp://${SFTP_USER}@${SFTP_HOST}" >> "$SCRIPT"
          else
            esc_user="$(printf '%s' "$SFTP_USER"     | sed 's/\\/\\\\/g; s/"/\\"/g')"
            esc_pass="$(printf '%s' "$SFTP_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')"
            {
              # Pure-FTPd on port 21 is Explicit FTPS: open plain ftp:// then
              # upgrade the control channel using AUTH TLS. `ftps://` is only
              # appropriate for implicit FTPS (normally port 990), which this
              # DirectAdmin host does not offer.
              echo "set ftp:ssl-auth TLS"
              echo "set ftp:ssl-force true"
              echo "set ftp:ssl-protect-data true"
              echo "set ssl:verify-certificate ${FTPS_VERIFY_CERT}"
              echo "open -u \"${esc_user}\",\"${esc_pass}\" ftp://${SFTP_HOST}:${PORT}"
            } >> "$SCRIPT"
          fi

          {
            echo "cd \"${REMOTE_DIR}\""
            echo "pwd"
            echo "cls -1"
            echo "bye"
          } >> "$SCRIPT"

          echo "Testing ${PROTOCOL} transport, TLS/authentication and remote-directory read access (no files will be uploaded)."
          lftp -f "$SCRIPT"
          echo "result=pass" >> "$GITHUB_OUTPUT"
          echo "Connection test passed. No files were uploaded."

      - name: Reconfirm automatic proof immediately before upload
        if: steps.gate.outputs.mode == 'production' && github.event_name == 'repository_dispatch'
        env:
          PROOF_COMMIT_SHA: ${{ steps.gate.outputs.proof_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          test "${PROOF_COMMIT_SHA}" = "$(git rev-parse origin/master)"
          echo "Automatic proof commit is still current master immediately before upload."

      - name: Upload dist/ to DirectAdmin (non-destructive)
        if: steps.gate.outputs.mode == 'production'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          PROTOCOL: ${{ steps.gate.outputs.protocol }}
          AUTH: ${{ steps.gate.outputs.auth }}
          PORT: ${{ steps.creds.outputs.port }}
          FTPS_VERIFY_CERT: ${{ vars.FTPS_VERIFY_CERT || 'yes' }}
        run: |
          set -euo pipefail
          umask 077

          REMOTE_DIR="${SFTP_REMOTE_DIR:-$DEFAULT_REMOTE_DIR}"
          echo "Remote directory: ${REMOTE_DIR}"
          BACKUP_DIR="$RUNNER_TEMP/predeploy"
          mkdir -p "$BACKUP_DIR"

          SCRIPT="$RUNNER_TEMP/lftp.script"
          : > "$SCRIPT"
          chmod 600 "$SCRIPT"
          # `lftp -f` can fail during TLS/authentication. Keep the credential
          # file private and remove it on every shell exit path, not only on a
          # successful transfer.
          trap 'rm -f "$SCRIPT"' EXIT

          {
            echo "set cmd:fail-exit yes"
            echo "set net:max-retries 3"
            echo "set net:reconnect-interval-base 5"
            echo "set net:timeout 30"
            # One transfer at a time: §2.3 item 8 of the DirectAdmin doc flags a
            # possible connection-rate limit on shared hosting, and a throttled
            # deploy is better than a banned IP.
            echo "set mirror:parallel-transfer-count 1"
            echo "set xfer:clobber on"
          } >> "$SCRIPT"

          if [ "$PROTOCOL" = "sftp" ]; then
            if [ "$AUTH" = "key" ]; then
              echo "set sftp:connect-program \"ssh -a -x -i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -p $PORT\"" >> "$SCRIPT"
            else
              export SSHPASS="$SFTP_PASSWORD"
              echo "set sftp:connect-program \"sshpass -e ssh -a -x -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -p $PORT\"" >> "$SCRIPT"
            fi
            echo "open sftp://${SFTP_USER}@${SFTP_HOST}" >> "$SCRIPT"
          else
            # Escape the two characters lftp treats specially inside a quoted
            # string. A newline in the password cannot be escaped, so reject it
            # with a clear message instead of producing a corrupt script.
            if [ "$(printf '%s' "$SFTP_PASSWORD" | wc -l)" -gt 0 ]; then
              echo "::error title=Unusable password::SFTP_PASSWORD contains a newline. Re-enter the secret without a trailing line break."
              exit 1
            fi
            esc_user="$(printf '%s' "$SFTP_USER"     | sed 's/\\/\\\\/g; s/"/\\"/g')"
            esc_pass="$(printf '%s' "$SFTP_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')"
            {
              # Port 21 on this DirectAdmin host is Explicit FTPS. `ftp://`
              # starts the ordinary FTP control connection, then these settings
              # require AUTH TLS before credentials/data can move. Do not use
              # `ftps://` here: that is implicit FTPS and fails on port 21.
              echo "set ftp:ssl-auth TLS"
              echo "set ftp:ssl-force true"
              echo "set ftp:ssl-protect-data true"
              echo "set ssl:verify-certificate ${FTPS_VERIFY_CERT}"
              # The password lives in this 0600 file rather than on lftp's
              # command line, so it never shows up in `ps`.
              echo "open -u \"${esc_user}\",\"${esc_pass}\" ftp://${SFTP_HOST}:${PORT}"
            } >> "$SCRIPT"
          fi

          {
            # Best-effort snapshots of the two tracked .htaccess files, so a
            # bad deploy can have either policy put back by hand immediately.
            echo "set cmd:fail-exit no"
            echo "get \"${REMOTE_DIR}/.htaccess\" -o \"${BACKUP_DIR}/htaccess.live\""
            echo "get \"${REMOTE_DIR}/data/.htaccess\" -o \"${BACKUP_DIR}/data-htaccess.live\""
            echo "set cmd:fail-exit yes"

            # `cd` first: if REMOTE_DIR is wrong (e.g. the account is chrooted)
            # this fails immediately, before a single byte is written anywhere.
            echo "cd \"${REMOTE_DIR}\""
            echo "lcd dist"

            # Pass 1 — everything except the two entry-point files.  lftp is
            # non-destructive by default; do NOT add --delete (or the invalid
            # --no-delete option) here.
            echo "mirror --reverse --verbose --exclude-glob index.html --exclude-glob .htaccess . ."

            # Pass 2 — the mirror excludes every .htaccess, so explicitly
            # publish the data cache policy before flipping the SPA entry point.
            echo "put data/.htaccess -o data/.htaccess"
            echo "put index.html"
            echo "put .htaccess"
            echo "bye"
          } >> "$SCRIPT"

          echo "--- lftp transfer plan (credentials redacted by GitHub) ---"
          grep -v -e '^open' -e 'connect-program' "$SCRIPT" || true
          echo "-----------------------------------------------------------"

          lftp -f "$SCRIPT"

          if [ -s "$BACKUP_DIR/htaccess.live" ]; then
            if cmp -s "$BACKUP_DIR/htaccess.live" dist/.htaccess; then
              echo "Live .htaccess was already identical to the one in the repo."
            else
              echo "::warning title=Server .htaccess replaced::The live .htaccess differed from public/.htaccess and has been overwritten with the repo version. The previous copy is attached to this run as the 'predeploy-htaccess' artifact. If the hosting admin had added rules there by hand, fold them into public/.htaccess."
            fi
          else
            echo "No pre-existing remote .htaccess was found (or it could not be read)."
          fi
          if [ -s "$BACKUP_DIR/data-htaccess.live" ]; then
            if cmp -s "$BACKUP_DIR/data-htaccess.live" dist/data/.htaccess; then
              echo "Live data/.htaccess was already identical to the one in the repo."
            else
              echo "::warning title=Server data/.htaccess replaced::The live data/.htaccess differed from public/data/.htaccess and has been overwritten with the repo version. The previous copy is attached to this run as the 'predeploy-htaccess' artifact."
            fi
          else
            echo "No pre-existing remote data/.htaccess was found (or it could not be read)."
          fi

          echo "Upload complete."

      - name: Keep the previous .htaccess files for rollback
        if: always() && steps.gate.outputs.mode == 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: predeploy-htaccess
          path: |
            ${{ runner.temp }}/predeploy/htaccess.live
            ${{ runner.temp }}/predeploy/data-htaccess.live
          if-no-files-found: ignore
          retention-days: 30

      # ─────────────────────────────────────────────────────────────────────
      # 6. Smoke test — the reason this workflow exists.
      #
      # A deploy that is not verified is still an open loop. So we do not check
      # "did lftp exit 0", we check "is production now byte-identical to what we
      # just built".
      #
      # TRAP THIS GUARDS AGAINST: public/.htaccess rewrites any non-existent
      # path to index.html, so a MISSING /data/manifest.json answers 200 with
      # HTML. Status codes alone are worthless here — every JSON check therefore
      # also asserts the content type and actually parses the body.
      # ─────────────────────────────────────────────────────────────────────
      - name: Smoke-test production
        if: steps.gate.outputs.mode == 'production'
        id: smoke
        env:
          ALLOW_INSECURE: ${{ vars.SMOKE_ALLOW_INSECURE_TLS || 'false' }}
        run: |
          set -uo pipefail
          BASE="${PRODUCTION_URL%/}"
          OUT="$RUNNER_TEMP/smoke"
          EXPECTED="$RUNNER_TEMP/expected.json"
          mkdir -p "$OUT"
          : > "$OUT/curl.err"
          fail=0

          # ---- TLS policy ---------------------------------------------------
          CURL=(curl --silent --show-error --location --max-time 30
                --retry 2 --retry-delay 3 --retry-connrefused
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache')
          if [ "$ALLOW_INSECURE" = "true" ]; then
            CURL+=(--insecure)
            echo "::warning title=Smoke test is NOT verifying TLS::SMOKE_ALLOW_INSECURE_TLS=true is an explicit temporary diagnostic override, so this run ignores HTTPS certificate errors. This does not make a certificate problem safe; restore false immediately after the approved diagnostic."
            echo "TLS verification is temporarily disabled for this smoke test (explicit override)."
          else
            echo "TLS verification: STRICT."
          fi

          # fetch <url> <body-file>  -> prints "<http_code> <content_type>"
          fetch() {
            local out=""
            out="$("${CURL[@]}" -o "$2" -w '%{http_code} %{content_type}' "$1" 2>>"$OUT/curl.err")" || true
            if [ -z "$out" ]; then out="000 none"; fi
            printf '%s' "$out"
          }

          json_content_type_ok() {
            case "$1" in *application/json*) return 0 ;; *) return 1 ;; esac
          }

          data_content_type_ok() {
            local filename="$1" ctype="$2"
            case "$filename" in
              *.geojson)
                case "$ctype" in *application/geo+json*|*application/json*) return 0 ;; *) return 1 ;; esac ;;
              *) json_content_type_ok "$ctype" ;;
            esac
          }

          expected_data_content_type() {
            case "$1" in
              *.geojson) printf '%s' 'application/geo+json or application/json' ;;
              *) printf '%s' 'application/json' ;;
            esac
          }

          data_endpoint_ok() {
            [ "$2" = "200" ] && data_content_type_ok "$1" "$3"
          }

          # Anchors and .ots files have no portable standard MIME type.  Reject
          # an SPA fallback explicitly, while the proof verifier checks bytes.
          opaque_endpoint_ok() {
            [ "$1" = "200" ] && ! grep -qiE '<!doctype|<html' "$2"
          }

          # check_html <path> <label> <body-file>
          check_html() {
            local res code ctype
            res="$(fetch "${BASE}$1" "$3")"
            code="${res%% *}"
            ctype="${res#* }"
            if [ "$code" != "200" ]; then
              echo "::error title=Smoke test failed::$2 (${BASE}$1) returned HTTP ${code}, expected 200."
              return 1
            fi
            case "$ctype" in
              *text/html*) ;;
              *)
                echo "::error title=Smoke test failed::$2 returned content-type '${ctype}', expected text/html."
                return 1 ;;
            esac
            if ! grep -q 'id="root"' "$3"; then
              echo "::error title=Smoke test failed::$2 returned 200 but the body is not the Borneo Tracker app shell."
              return 1
            fi
            echo "  ok  $2 -> 200 ${ctype}"
            return 0
          }

          echo "=== 1. Home page ==="
          if ! check_html "/" "home page" "$OUT/home.html"; then fail=1; fi

          echo ""
          echo "=== 2. SPA deep link (proves .htaccess survived the upload) ==="
          # /news is a client-side route with no file behind it, so without the
          # rewrite rule from .htaccess this 404s.
          if ! check_html "/news" "deep link /news" "$OUT/news.html"; then fail=1; fi

          echo ""
          echo "=== 3. Production is byte-identical to the build we just made ==="
          # Short retry loop: the web server can keep serving a cached copy for a
          # few seconds after the upload lands.
          matched=0
          for attempt in 1 2 3 4 5 6; do
            m_res="$(fetch "${BASE}/data/manifest.json" "$OUT/manifest.json")"
            a_res="$(fetch "${BASE}/data/anchors.jsonl" "$OUT/anchors.jsonl")"
            p_res="$(fetch "${BASE}/data/manifest.json.ots" "$OUT/manifest.json.ots")"
            m_code="${m_res%% *}"; m_type="${m_res#* }"
            a_code="${a_res%% *}"; p_code="${p_res%% *}"
            data_ok=1
            while read -r manifest_path; do
              filename="${manifest_path#public/data/}"
              data_res="$(fetch "${BASE}/data/${filename}" "$OUT/${filename}")"
              data_code="${data_res%% *}"; data_type="${data_res#* }"
              if ! data_endpoint_ok "$filename" "$data_code" "$data_type"; then
                echo "  attempt ${attempt}: ${filename} -> ${data_code} ${data_type}; expected $(expected_data_content_type "$filename")"
                data_ok=0
              fi
            done < <(python verify_manifest.py paths)

            # A file that is NOT on the server answers 200 + text/html here (the
            # SPA rewrite catches it), so the content type is the real check.
            if json_content_type_ok "$m_type" && [ "$m_code" = "200" ] \
               && opaque_endpoint_ok "$a_code" "$OUT/anchors.jsonl" \
               && opaque_endpoint_ok "$p_code" "$OUT/manifest.json.ots" \
               && [ "$data_ok" = "1" ]; then
              if grep -qiE '<!doctype|<html' "$OUT/anchors.jsonl" "$OUT/manifest.json.ots"; then
                echo "  attempt ${attempt}: proof endpoint returned SPA HTML"
                continue
              fi
              manifest_sha="$(sha256sum "$OUT/manifest.json" | awk '{print $1}')"
              mkdir -p "$OUT/versions/${manifest_sha}"
              vm_res="$(fetch "${BASE}/data/versions/${manifest_sha}/manifest.json" "$OUT/versions/${manifest_sha}/manifest.json")"
              vp_res="$(fetch "${BASE}/data/versions/${manifest_sha}/manifest.json.ots" "$OUT/versions/${manifest_sha}/manifest.json.ots")"
              vm_code="${vm_res%% *}"; vm_type="${vm_res#* }"
              vp_code="${vp_res%% *}"
              if [ "$vm_code" != "200" ] || ! json_content_type_ok "$vm_type" \
                 || ! opaque_endpoint_ok "$vp_code" "$OUT/versions/${manifest_sha}/manifest.json.ots" \
                 || ! python verify_proof_contract.py "$OUT" >/dev/null 2>&1; then
                echo "  attempt ${attempt}: versioned Manifest/proof pair unavailable or mismatched"
                continue
              fi
              if python verify_manifest.py verify-remote "$OUT" "$EXPECTED" > "$OUT/cmp.log" 2>&1; then
                matched=1
                cat "$OUT/cmp.log"
                break
              fi
            else
              echo "  attempt ${attempt}: manifest -> ${m_code} ${m_type}; anchors -> ${a_code}; proof -> ${p_code}"
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "  attempt ${attempt}: production does not match yet; retrying in 10s..."
              sleep 10
            fi
          done

          if [ "$matched" -ne 1 ]; then
            fail=1
            cat "$OUT/cmp.log" 2>/dev/null || true
            # Last probe, with a cache-buster. If THAT matches, the new bytes
            # really are on the server and the problem is an edge/page cache —
            # a completely different fix from "the upload never landed".
            CACHE_OUT="$OUT/cache-bust"
            mkdir -p "$CACHE_OUT"
            cache_endpoint_ok=1
            while read -r manifest_path; do
              filename="${manifest_path#public/data/}"
              data_res="$(fetch "${BASE}/data/${filename}?cachebust=${GITHUB_RUN_ID}" "$CACHE_OUT/${filename}")"
              data_code="${data_res%% *}"; data_type="${data_res#* }"
              if ! data_endpoint_ok "$filename" "$data_code" "$data_type"; then
                echo "::error title=Production data endpoint/MIME error::Cache-busted /data/${filename} returned HTTP ${data_code} with content-type '${data_type}'; expected $(expected_data_content_type "$filename")."
                cache_endpoint_ok=0
              fi
            done < <(python verify_manifest.py paths)
            cm_res="$(fetch "${BASE}/data/manifest.json?cachebust=${GITHUB_RUN_ID}" "$CACHE_OUT/manifest.json")"
            ca_res="$(fetch "${BASE}/data/anchors.jsonl?cachebust=${GITHUB_RUN_ID}" "$CACHE_OUT/anchors.jsonl")"
            cp_res="$(fetch "${BASE}/data/manifest.json.ots?cachebust=${GITHUB_RUN_ID}" "$CACHE_OUT/manifest.json.ots")"
            cm_code="${cm_res%% *}"; cm_type="${cm_res#* }"
            ca_code="${ca_res%% *}"; cp_code="${cp_res%% *}"
            if [ "$cm_code" != "200" ] || ! json_content_type_ok "$cm_type"; then
              echo "::error title=Production data endpoint/MIME error::Cache-busted /data/manifest.json returned HTTP ${cm_code} with content-type '${cm_type}'; expected application/json."
              cache_endpoint_ok=0
            fi
            if ! opaque_endpoint_ok "$ca_code" "$CACHE_OUT/anchors.jsonl"; then
              echo "::error title=Production endpoint error::Cache-busted /data/anchors.jsonl is missing or returned SPA HTML."
              cache_endpoint_ok=0
            fi
            if ! opaque_endpoint_ok "$cp_code" "$CACHE_OUT/manifest.json.ots"; then
              echo "::error title=Production endpoint error::Cache-busted /data/manifest.json.ots is missing or returned SPA HTML."
              cache_endpoint_ok=0
            fi
            if [ "$cache_endpoint_ok" = "1" ]; then
              manifest_sha="$(sha256sum "$CACHE_OUT/manifest.json" | awk '{print $1}')"
              mkdir -p "$CACHE_OUT/versions/${manifest_sha}"
              vm_res="$(fetch "${BASE}/data/versions/${manifest_sha}/manifest.json?cachebust=${GITHUB_RUN_ID}" "$CACHE_OUT/versions/${manifest_sha}/manifest.json")"
              vp_res="$(fetch "${BASE}/data/versions/${manifest_sha}/manifest.json.ots?cachebust=${GITHUB_RUN_ID}" "$CACHE_OUT/versions/${manifest_sha}/manifest.json.ots")"
              vm_code="${vm_res%% *}"; vm_type="${vm_res#* }"; vp_code="${vp_res%% *}"
              if [ "$vm_code" != "200" ] || ! json_content_type_ok "$vm_type"; then
                echo "::error title=Production data endpoint/MIME error::Cache-busted versioned Manifest returned HTTP ${vm_code} with content-type '${vm_type}'; expected application/json."
                cache_endpoint_ok=0
              fi
              if ! opaque_endpoint_ok "$vp_code" "$CACHE_OUT/versions/${manifest_sha}/manifest.json.ots"; then
                echo "::error title=Production endpoint error::Cache-busted versioned OTS proof is missing or returned SPA HTML."
                cache_endpoint_ok=0
              fi
            fi
            if [ "$cache_endpoint_ok" = "1" ] \
               && python verify_proof_contract.py "$CACHE_OUT" >/dev/null 2>&1 \
               && python verify_manifest.py verify-remote "$CACHE_OUT" "$EXPECTED" >/dev/null 2>&1; then
              echo "::error title=Stale cache, not a failed upload::The new files are correct when fetched with a cache-buster, but the ordinary URL still serves an old copy. The upload succeeded; check LiteSpeed/LSCache or another shared cache for this domain."
            elif [ "$cache_endpoint_ok" != "1" ]; then
              echo "::error title=Production endpoint/MIME error::The cache-busted public data endpoint is invalid. This is not a stale-cache-only failure; check the deployed .htaccess and remote path."
            else
              echo "::error title=Production byte mismatch::The cache-busted data endpoints are reachable but do not match the exact build/proof contract. Check the upload target and deployed files."
            fi
          fi

          # ---- 4. Advisory: has the certificate been fixed yet? --------------
          # This runs regardless of the variable, so the log tells the owner the
          # day the certificate starts validating and the check can be tightened.
          echo ""
          echo "=== 4. TLS certificate status ==="
          if [ "${BASE#https://}" = "$BASE" ]; then
            echo "  skipped: ${BASE} is not an https URL."
            echo "tls=not-https" >> "$GITHUB_OUTPUT"
          elif curl --silent --show-error --max-time 20 -o /dev/null "${BASE}/" 2>"$OUT/tls.err"; then
            if [ "$ALLOW_INSECURE" = "true" ]; then
              echo "::warning title=TLS certificate now validates — remove override::A strict TLS request to ${BASE}/ succeeded. Remove the temporary SMOKE_ALLOW_INSECURE_TLS=true override (or set it to false) so every future deploy verifies the certificate."
              echo "tls=fixed-but-not-enforced" >> "$GITHUB_OUTPUT"
            else
              echo "  ok  strict TLS handshake succeeded."
              echo "tls=strict-ok" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "  strict TLS check FAILED: $(head -1 "$OUT/tls.err" 2>/dev/null)"
            echo "tls=broken" >> "$GITHUB_OUTPUT"
            if [ "$ALLOW_INSECURE" != "true" ]; then
              echo "::error title=Smoke test failed::Strict TLS is enabled (SMOKE_ALLOW_INSECURE_TLS is false or unset), but the certificate for ${BASE} is not valid."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo ""
            echo "--- curl stderr ---"
            cat "$OUT/curl.err" 2>/dev/null || true
            echo ""
            echo "SMOKE TEST FAILED — production is not serving what we built. See 'If the smoke test fails' in docs/DEPLOYMENT_SETUP.md."
            exit 1
          fi
          echo "result=pass" >> "$GITHUB_OUTPUT"
          echo ""
          echo "SMOKE TEST PASSED — production is byte-identical to this build."

      # ─────────────────────────────────────────────────────────────────────
      # 7. Summary. Runs even on failure so the run page always says what
      #    happened and what is live.
      # ─────────────────────────────────────────────────────────────────────
      - name: Write deployment summary
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          COMMIT: ${{ steps.rev.outputs.sha }}
          COMMIT_SHORT: ${{ steps.rev.outputs.short }}
          COMMIT_SUBJECT: ${{ steps.rev.outputs.subject }}
          GENERATED_AT: ${{ steps.assert.outputs.generated_at }}
          SMOKE: ${{ steps.smoke.outputs.result }}
          TLS: ${{ steps.smoke.outputs.tls }}
          MODE: ${{ steps.gate.outputs.mode }}
          PROOF_COMMIT_SHA: ${{ steps.gate.outputs.proof_commit_sha }}
          CONNECTION: ${{ steps.connection.outputs.result }}
          CONNECTION_OUTCOME: ${{ steps.connection.outcome }}
          PROTOCOL: ${{ steps.gate.outputs.protocol }}
          AUTH: ${{ steps.gate.outputs.auth }}
        run: |
          set -uo pipefail
          {
            if [ "${MODE}" = "dry_run" ]; then
              echo "## Dry run — nothing was uploaded"
            elif [ "${MODE}" = "connection_test_only" ] && [ "${CONNECTION}" = "pass" ]; then
              echo "## Connection test passed — nothing was uploaded"
            elif [ "${MODE}" = "connection_test_only" ]; then
              echo "## Connection test did not complete — nothing was uploaded"
            elif [ "${SMOKE}" = "pass" ]; then
              echo "## Deployed and verified"
            elif [ "${SMOKE}" = "fail" ]; then
              echo "## Deploy ran but VERIFICATION FAILED"
            else
              echo "## Deploy did not complete"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Target | ${PRODUCTION_URL} |"
            echo "| Trigger | \`${TRIGGER}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| Requested proof commit | \`${PROOF_COMMIT_SHA}\` |"
            echo "| Commit | \`${COMMIT_SHORT}\` — ${COMMIT_SUBJECT} |"
            echo "| Data \`generatedAt\` | **${GENERATED_AT:-unknown}** |"
            if [ "${MODE}" = "connection_test_only" ]; then
              echo "| Transport | ${PROTOCOL} (${AUTH} auth), read-only connection test |"
              echo "| Connection test | ${CONNECTION:-${CONNECTION_OUTCOME:-not run}} |"
            else
              echo "| Transport | ${PROTOCOL} (${AUTH} auth), non-destructive mirror |"
            fi
            echo "| Smoke test | ${SMOKE:-not run} |"
            echo "| TLS | ${TLS:-not checked} |"
            echo

            if [ -f "$RUNNER_TEMP/expected.json" ]; then
              echo "### Manifest shipped"
              echo
              echo "| File | SHA-256 | Bytes |"
              echo "|---|---|---:|"
              python - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "expected.json")))
          for name, entry in sorted(data["files"].items()):
              print("| `%s` | `%s` | %s |" % (name, entry["sha256"], entry["bytes"]))
          PY
              echo
            fi

            if [ "${SMOKE}" = "fail" ]; then
              echo "### What to do"
              echo
              echo "Production is **not** serving this build. Read the \"Smoke-test production\" step"
              echo "above for the specific assertion that failed, then see the rollback section of"
              echo "\`docs/DEPLOYMENT_SETUP.md\`."
            fi
            if [ "${TLS}" = "fixed-but-not-enforced" ]; then
              echo "### Certificate looks fixed"
              echo
              echo "Remove the temporary \`SMOKE_ALLOW_INSECURE_TLS=true\` override (or set it"
              echo "to \`false\`) so every future deploy validates the certificate."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
