name: Verify Phase 1 attestation integration

# This is deliberately non-mutating. It proves that the repository's real
# OIDC/Sigstore policy works before a release workflow is allowed to write a
# proof or dispatch deployment. Fork PRs are excluded because their code must
# never receive an identity-capable token.
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/anchor*.yml"
      - "anchor_provenance.py"
      - "manifest_contract.py"
      - "public/data/manifest.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sigstore-policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate the submitted Manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from manifest_contract import strict_json_loads, validate_manifest
          validate_manifest(strict_json_loads(Path("public/data/manifest.json").read_text(encoding="utf-8"), "manifest"))
          PY

      - name: Attest the exact Manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: public/data/manifest.json

      - name: Verify Sigstore identity constraints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify public/data/manifest.json \
            --bundle "${{ steps.attest.outputs.bundle-path }}" \
            --repo "${{ github.repository }}" \
            --signer-workflow .github/workflows/anchor-integration.yml \
            --source-ref "${{ github.ref }}" \
            --source-digest "${{ github.sha }}"
