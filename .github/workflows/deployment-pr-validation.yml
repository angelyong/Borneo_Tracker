name: Validate deployment cache policy

# This workflow is deliberately read-only. It validates the files that control
# DirectAdmin publication, data/proof caching, and production smoke checks on a
# PR, but never receives deployment secrets and never contacts DirectAdmin.
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deployment-pr-validation.yml"
      - "public/.htaccess"
      - "public/data/**"
      - "tests/test_deploy_workflow_contract.py"
      - "tests/test_workflow_contract.py"
      - "tests/test_deploy_pr_validation_workflow.py"
      - "verify_manifest.py"
      - "verify_proof_contract.py"
      - "verify_anchor.py"
      - "manifest_contract.py"
      - "witness_events.py"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deployment-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate cache and deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate deployment contracts
        run: |
          python -m unittest \
            tests.test_deploy_workflow_contract \
            tests.test_workflow_contract \
            tests.test_deploy_pr_validation_workflow
          python validate_data.py
          python verify_manifest.py verify public/data
          python verify_proof_contract.py public/data
          python verify_anchor.py --allow-pending

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.21.1"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and build the exact publishable artifact
        run: |
          npm run lint
          npm run build
          test -s dist/.htaccess
          test -s dist/data/.htaccess
